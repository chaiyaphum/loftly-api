name: deploy

# loftly-api deploys to DigitalOcean App Platform, NOT Fly.io.
#
# The app `loftly-api-staging` has `deploy_on_push: true` on its `main`
# branch (see ../loftly/mvp/artifacts/do/app-spec-staging.yaml and
# ../loftly/mvp/artifacts/do/README.md). DO builds the Dockerfile, runs the
# PRE_DEPLOY `alembic upgrade head` job, and rolls out automatically on every
# push to `main`. There is no flyctl step and no GitHub-driven deploy.
#
# This workflow is informational only (manual trigger) so the deploy path is
# discoverable from the Actions tab without implying GitHub performs the deploy.
# The stack swap from Fly.io → DO was decided 2026-04-21 (STRATEGY.md decision log).

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Where deploys happen
        run: |
          echo "loftly-api is deployed by DigitalOcean App Platform."
          echo "App: loftly-api-staging (deploy_on_push: true on main)."
          echo "Runbook: loftly/mvp/artifacts/do/README.md"
          echo "DR/restore: loftly-api/scripts/dr/README.md"
